[package]
name = "summoning-circle"
description = "Summon your processes and ensure they can never die"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ncipollo/summoning-circle"
version = "0.1.0"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.6", features = ["derive"] }
dirs = "=6.0.0"
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
tokio = { version = "=1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.5"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

[dev-dependencies]
tempfile = "=3.27.0"
