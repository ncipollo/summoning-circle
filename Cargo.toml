[package]
name = "summoning-circle"
description = "Summon your processes and ensure they can never die"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ncipollo/summoning-circle"
version = "0.1.0"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "=4.6.6", features = ["derive"] }
dirs = "=6.0.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.5"

[dev-dependencies]
tempfile = "=3.27.0"
